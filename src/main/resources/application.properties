spring.application.name=agenda-api

# Conexão com o banco: vem só de variáveis de ambiente, sem valor padrão.
# Se alguma faltar, a aplicação falha ao subir em vez de usar um valor oculto.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# O esquema do banco vem só das migrações do Flyway (src/main/resources/db/migration).
spring.flyway.enabled=true
# O Hibernate não cria nem altera tabelas.
spring.jpa.hibernate.ddl-auto=none
# Evita manter a sessão JPA aberta durante a renderização da resposta.
spring.jpa.open-in-view=false

# Actuator: expõe apenas health e prometheus.
management.endpoints.web.exposure.include=health,prometheus

# Logs estruturados em JSON (formato ECS) no console. Valores do MDC, como o
# idDaRequisicao do FiltroDeIdDaRequisicao, entram em cada linha.
logging.structured.format.console=ecs

# Métrica http.server.requests (duração por rota, método e status) com
# histograma, para calcular o p95 no Prometheus, e um balde exato em 300 ms,
# que é o limite do SLO (ver README e docs/desempenho.md).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=300ms
